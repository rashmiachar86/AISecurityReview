<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0D1B2A; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0D1B2A; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
}
.accent-bar {
  position: absolute; top: 0; left: 0; width: 8pt; height: 405pt;
  background: #1B6CA8;
}
.red-bar {
  position: absolute; top: 0; left: 8pt; width: 4pt; height: 405pt;
  background: #C0392B;
}
.content { margin-left: 60pt; margin-right: 60pt; }
.eyebrow {
  color: #1B6CA8; font-size: 11pt; font-weight: bold;
  letter-spacing: 3pt; text-transform: uppercase; margin-bottom: 12pt;
}
.title {
  color: #FFFFFF; font-size: 36pt; font-weight: bold;
  line-height: 1.15; margin-bottom: 8pt;
}
.subtitle {
  color: #AAB7B8; font-size: 14pt; font-weight: normal;
  margin-bottom: 24pt;
}
.tagline {
  color: #C0392B; font-size: 11pt; font-weight: bold;
  letter-spacing: 1pt;
}
.bottom-info {
  position: absolute; bottom: 20pt; right: 40pt;
  color: #556270; font-size: 9pt; text-align: right;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="red-bar"></div>
<div class="content">
  <p class="eyebrow">Security Intelligence Report</p>
  <p class="title">Non-Human Identity (NHI)<br>Security Threats in<br>Software Supply Chains</p>
  <p class="subtitle">Threat Landscape Analysis &amp; Epic Brainstorming</p>
  <p class="tagline">CRITICAL INFRASTRUCTURE · ELEVATED RISK</p>
</div>
<div class="bottom-info">
  <p>2026-04-27</p>
</div>
</body>
</html>
